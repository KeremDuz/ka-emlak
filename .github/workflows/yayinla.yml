# main dalına her gönderimde tip kontrolü, testler ve derleme. Yayını Cloudflare Workers Builds yapar (docs/DEPLOYMENT.md).
name: Kontrol

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: yayinla
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yayinla:
    runs-on: ubuntu-latest
    env:
      # Sitenin gerçek adresi (ör. https://ka-emlak.<hesap>.workers.dev); depo değişkeni olarak eklenir.
      SITE_URL: ${{ vars.SITE_URL }}
      # Herkese açık değerler (sır değil); derleme sırasında sayfaya gömülür. Boşsa ölçüm ve doğrulama eklenmez.
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
      PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # @astrojs/check, TypeScript 7 ile eş bağımlılık çakışması bildirir; kilit dosyası bu seçenekle oluşturuldu.
      - run: npm ci --legacy-peer-deps
      - name: Tip kontrolü
        run: node node_modules/typescript/bin/tsc --noEmit -p .
      - name: Testler
        run: node scripts/run.mjs test
      - name: Derleme
        run: node scripts/run.mjs build
      # Yayın artık Cloudflare Workers Builds ile yapılır (kaemlak12 hesabı, GitHub bağlantısı); bu iş akışı yalnız kontrol eder.
