# main dalına her gönderimde: tip kontrolü, testler, derleme ve Cloudflare Workers'a yayın.
# Yayın adımı depo sırları eklenince çalışır (docs/DEPLOYMENT.md, "GitHub'dan otomatik yayın"):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Sırlar yokken yalnız kontrol ve derleme yapılır.
name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: yayinla
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yayinla:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Sitenin gerçek adresi (ör. https://ka-emlak.<hesap>.workers.dev); depo değişkeni olarak eklenir.
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # @astrojs/check, TypeScript 7 ile eş bağımlılık çakışması bildirir; kilit dosyası bu seçenekle oluşturuldu.
      - run: npm ci --legacy-peer-deps
      - name: Tip kontrolü
        run: node node_modules/typescript/bin/tsc --noEmit -p .
      - name: Testler
        run: node scripts/run.mjs test
      - name: Derleme
        run: node scripts/run.mjs build
      - name: Cloudflare'a yayınla
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy
      - name: Yayın atlandı
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Cloudflare sırları eklenmediği için yayın yapılmadı. Adımlar docs/DEPLOYMENT.md içinde."
